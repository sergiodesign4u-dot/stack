<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кабінет тренера - завантаження - Stack (wireframe 5.2 · loading)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">
<!-- stand chrome only, never part of the system: see design/_stand.css -->
<link rel="stylesheet" href="_stand.css">
<style>
/* node 5.2 Кабінет тренера - LOADING skeleton (static, no animation). Greyscale. */
.acc { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 16px; }
@media (min-width: 960px) { .acc { grid-template-columns: 268px 1fr; gap: 28px; } }
.acc-nav { align-self: start; }
.sk { background:var(--bg-sunken); border-radius: 8px; border:1px solid var(--line-hair); }
.sk.line { height: 12px; }
.sk-prof { border:1px solid var(--line-hair); border-radius: 14px; padding: 15px 16px; display: flex; gap: 13px; align-items: center; }
.sk-prof .av { width: 48px; height: 48px; border-radius: 50%; flex: none; }
.sk-prof .who { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.sk-links { margin-top: 12px; border:1px solid var(--line-hair); border-radius: 14px; overflow: hidden; }
.sk-links .row { padding: 15px; border-bottom:1px solid var(--line-hair); }
.sk-links .row:last-child { border-bottom: none; }
.sk-h1 { height: 26px; width: 55%; }
.sk-sub { height: 13px; width: 80%; margin-top: 10px; }
.sk-strip { height: 48px; margin-top: 15px; border-radius: 12px; }
.sk-cta { height: 86px; margin-top: 16px; border-radius: 14px; }
.acc-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 18px; }
.sk-card { height: 150px; border-radius: 14px; }
.sk-load { display: flex; align-items: center; gap: 10px; margin-top: 22px; color:var(--text-secondary); font-size: 13px; font-weight: 600; justify-content: center; }
/* 7.18: the moving arc is the action colour - auth-dialog.css `.auth-spin` and
   checkout-form.css `.co-spin` both settled it. This was the third edition. */
.sk-spin { width: 16px; height: 16px; border:2px solid var(--line-strong); border-top-color:var(--line-action); border-radius: 50%; }
</style>
</head>
<body>
<!-- WIREFRAME · node 5.2 Кабінет тренера - LOADING. Static skeleton of the dashboard. -->
<div class="wf-bar" id="wf-bar"></div>
<div class="wf-canvas">
<header id="wf-header"></header>

<main class="wf-page">
  <nav class="crumb" aria-label="Хлібні крихти">
    <a href="index.html">Головна</a><span class="sep"></span>
    <span class="cur">Кабінет тренера</span>
  </nav>

  <div class="acc" aria-busy="true">
    <aside class="acc-nav">
      <div class="sk-prof">
        <div class="sk av"></div>
        <div class="who"><div class="sk line" style="width:60%"></div><div class="sk line" style="width:85%"></div></div>
      </div>
      <div class="sk-links">
        <div class="row"><div class="sk line" style="width:50%"></div></div>
        <div class="row"><div class="sk line" style="width:65%"></div></div>
        <div class="row"><div class="sk line" style="width:45%"></div></div>
        <div class="row"><div class="sk line" style="width:60%"></div></div>
        <div class="row"><div class="sk line" style="width:40%"></div></div>
      </div>
    </aside>

    <div class="acc-main">
      <div class="sk sk-h1"></div>
      <div class="sk sk-sub"></div>
      <div class="sk sk-strip"></div>
      <div class="sk sk-cta"></div>
      <div class="acc-grid">
        <div class="sk sk-card"></div>
        <div class="sk sk-card"></div>
      </div>
      <div class="sk-load"><span class="sk-spin" aria-hidden="true"></span> Завантажуємо кабінет…</div>
    </div>
  </div>
</main>

<footer id="wf-footer"></footer>
</div>

<script src="../wireframes/_nav.js"></script>
<script src="system/theme.js"></script>
<script src="system/icons.js"></script>
<script src="system/marks.js"></script>
<script src="system/fields.js"></script>
<script src="_nav.js"></script>
<script>wfHeader('coach'); wfFooter(); wfBar('coach-home.html','loading');  uivFixLinks(); uivBar(); uivChrome();
</script>
</body>
</html>
