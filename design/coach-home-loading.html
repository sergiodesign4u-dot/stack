<title>Кабінет тренера - завантаження - Stack (wireframe 5.2 · loading)</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="_stand.css">
<style>



/* FIFTEEN RULES LEFT THIS BLOCK AT STEP 8.30 AND NOTHING REPLACED THEM: every
   one was a second name for something `skeleton.css`, `account-shell.css` or
   `empty-state.css` already declares, and the buyer's twin of this screen -
   `account-loading.html`, the same shell, the same job - carries no private rule
   at all. The mapping, and each pair was read on both running pages:

     .sk / .sk.line       -> .skline        the bar. `.sk` also carried a 1px
                                            hairline the system's bar does not
                                            have, and `height: 12px` is the
                                            single instance skeleton.css names in
                                            its own comment: «24 and 10, not 24
                                            and 12, because 12 was one instance
                                            disagreeing with 78». This was that one.
     .sk-prof / .av / .who -> .acc-prof and its two children
     .sk-links / .row      -> .acc-links / .acc-link
     .sk-h1 / .sk-sub      -> .acc-h1sk / .acc-subsk
     .sk-card / .sk-strip  -> .skcardbox
     .sk-load              -> .loadnote
     .sk-spin              -> DELETED WITH NOTHING TAKING IT. Its own comment
                              said «this was the third edition» of the spinner and
                              named the two that settled it - and skeleton.css
                              answers the question that comment did not ask:
                              «It says "still going", not "broken": one slow
                              breath, NEVER A SPINNER.» A skeleton screen that
                              also spins is two loading languages at once.

   `.skpulse` came WITH the classes rather than being added: it is a modifier on
   the container, and taking `.acc-nav`, `.acc-grid` and the two bars means the
   page breathes the way every other loading screen in the product does. And the
   rail's phone shape came with them too - below 960 `.acc-links` is a scrollable
   chip strip, which is what four cabinet screens got back at step 8.22 for
   exactly the same reason. */
</style>
</head>
<body class="coach">
<!-- WIREFRAME · node 5.2 Кабінет тренера - LOADING. Static skeleton of the dashboard. -->
<div class="wf-bar" id="wf-bar"></div>
<div class="wf-canvas">
<header id="wf-header"></header>

<main class="wf-page">
  <nav class="crumb" aria-label="Хлібні крихти">
    <a href="index.html">Головна</a><span class="sep"></span>
    <span class="cur">Кабінет тренера</span>
  </nav>

  <!-- THE SKELETON IS A PROMISE ABOUT THE BOX THAT REPLACES IT - skeleton.css's own
       sentence, and this screen was breaking it four ways at once. Step 8.30
       rewrote it onto the same classes account-loading.html uses, which is the
       buyer's twin of this exact screen and carries NO private rule at all.
       What the private version promised against what coach-home.html draws,
       measured at 390 before the change:
         the rail   5 stacked rows, 358 x 216   ->  a 48-tall chip strip below 960
         the strip  358 x 48                    ->  358 x 145.17  (`.cstat`)
         a CTA      358 x 86                    ->  NOTHING. `.cnew` was deleted
                    from coach-home.html at step 7.98 and the skeleton kept promising it
         the grid   2 boxes side by side, 316   ->  3 full-width cards, 1265.34
       and none of it breathed: `.skpulse` was on no element on this page, while
       every skeleton on the buyer's side pulses. -->
  <div class="acc" aria-busy="true">
    <aside class="acc-nav skpulse">
      <div class="acc-prof">
        <div class="av"></div>
        <div class="who"><div class="skline m"></div><div class="skline l"></div></div>
      </div>
      <div class="acc-links">
        <div class="acc-link"><div class="skline m"></div></div>
        <div class="acc-link"><div class="skline s"></div></div>
        <div class="acc-link"><div class="skline l"></div></div>
        <div class="acc-link"><div class="skline s"></div></div>
        <div class="acc-link"><div class="skline m"></div></div>
        <div class="acc-link"><div class="skline m"></div></div>
        <div class="acc-link"><div class="skline m"></div></div>
      </div>
    </aside>

    <div class="acc-main">
      <div class="acc-h1sk skpulse"></div>
      <div class="acc-subsk skpulse"></div>

      <!-- `.cstat`, the tier chip + wholesale note + «керувати тарифом» -->
      <div class="skcardbox skpulse" style="margin-top:16px">
        <div class="skline s"></div><div class="skline l"></div>
      </div>

      <!-- three full-width cards, which is what coach-home.html actually draws -->
      <div class="acc-grid skpulse">
        <div class="skcardbox span2"><div class="skline s"></div><div class="skline m" style="margin:14px 0"></div><div class="skline l"></div><div class="skline m"></div></div>
        <div class="skcardbox span2"><div class="skline s"></div><div class="skline m" style="margin:14px 0"></div><div class="skline l"></div><div class="skline m"></div></div>
        <div class="skcardbox span2"><div class="skline s"></div><div class="skline m" style="margin:14px 0"></div><div class="skline l"></div></div>
      </div>
      <p class="loadnote">Завантажуємо кабінет…</p>
    </div>
  </div>
</main>

<footer id="wf-footer"></footer>
</div>

<script src="../wireframes/_nav.js"></script>

<script src="system/icons.js"></script>

<script src="_nav.js"></script>
<script>wfHeader('coach'); wfFooter(); wfBar('coach-home.html','loading');  uivFixLinks(); uivBar(); uivChrome();
</script>
</body>
