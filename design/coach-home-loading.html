<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кабінет тренера - завантаження - Stack (wireframe 5.2 · loading)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">

<link rel="stylesheet" href="_stand.css">
</head>
<body class="coach">
<!-- WIREFRAME · node 5.2 Кабінет тренера - LOADING. Static skeleton of the dashboard. -->
<div class="wf-bar" id="wf-bar"></div>
<div class="wf-canvas">
<header id="wf-header"></header>

<main class="wf-page">
  <nav class="crumb" aria-label="Хлібні крихти">
    <a href="index.html">Головна</a><span class="sep"></span>
    <span class="cur">Кабінет тренера</span>
  </nav>

  <!-- THE SKELETON IS A PROMISE ABOUT THE BOX THAT REPLACES IT - skeleton.css's own
       sentence, and this screen was breaking it four ways at once. Step 8.30
       rewrote it onto the same classes account-loading.html uses, which is the
       buyer's twin of this exact screen and carries NO private rule at all.
       What the private version promised against what coach-home.html draws,
       measured at 390 before the change:
         the rail   5 stacked rows, 358 x 216   ->  a 48-tall chip strip below 960
         the strip  358 x 48                    ->  358 x 145.17  (`.cstat`)
         a CTA      358 x 86                    ->  NOTHING. `.cnew` was deleted
                    from coach-home.html at step 7.98 and the skeleton kept promising it
         the grid   2 boxes side by side, 316   ->  3 full-width cards, 1265.34
       and none of it breathed: `.skpulse` was on no element on this page, while
       every skeleton on the buyer's side pulses. -->
  <div class="acc" aria-busy="true">
    <aside class="acc-nav skpulse">
      <div class="acc-prof">
        <div class="av"></div>
        <div class="who"><div class="skline m"></div><div class="skline l"></div></div>
      </div>
      <div class="acc-links">
        <div class="acc-link"><div class="skline m"></div></div>
        <div class="acc-link"><div class="skline s"></div></div>
        <div class="acc-link"><div class="skline l"></div></div>
        <div class="acc-link"><div class="skline s"></div></div>
        <div class="acc-link"><div class="skline m"></div></div>
        <div class="acc-link"><div class="skline m"></div></div>
        <div class="acc-link"><div class="skline m"></div></div>
      </div>
    </aside>

    <div class="acc-main">
      <div class="acc-h1sk skpulse"></div>
      <div class="acc-subsk skpulse"></div>

      <!-- `.cstat`, the tier chip + wholesale note + «керувати тарифом» -->
      <div class="skcardbox skpulse">
        <div class="skline s"></div><div class="skline l"></div>
      </div>

      <!-- three full-width cards, which is what coach-home.html actually draws -->
      <div class="acc-grid skpulse">
        <div class="skcardbox span2"><div class="skline s"></div><div class="skline m skline--sep"></div><div class="skline l"></div><div class="skline m"></div></div>
        <div class="skcardbox span2"><div class="skline s"></div><div class="skline m skline--sep"></div><div class="skline l"></div><div class="skline m"></div></div>
        <div class="skcardbox span2"><div class="skline s"></div><div class="skline m skline--sep"></div><div class="skline l"></div></div>
      </div>
      <p class="loadnote">Завантажуємо кабінет…</p>
    </div>
  </div>
</main>

<footer id="wf-footer"></footer>
</div>

<script src="../wireframes/_nav.js"></script>
<script src="system/theme.js"></script>
<script src="system/icons.js"></script>
<script src="system/marks.js"></script>
<script src="system/fields.js"></script>
<script src="_nav.js"></script>
<script>wfHeader('coach'); wfFooter(); wfBar('coach-home.html','loading');  uivFixLinks(); uivBar(); uivChrome(); uivInert();
</script>
</body>
</html>
