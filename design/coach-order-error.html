<style>
/* ============================================================
   node 5.7 Деталі замовлення тренера - one placed order, GROUPED BY
   CLIENT (same grouping as coach cart 6.0). Header + single delivery
   to the coach + per-client sections (coach-tier price) + grand total
   + per-client repeat (Job 4). Private → noindex. States: loading · error.
   ============================================================ */
.od-wrap { max-width: 900px; }
.od-back { font-size: 12.5px; font-weight: 700; color: var(--text-primary); text-decoration: underline; }

/* header card */
.od-head { border:1px solid var(--line-hair); border-radius: 14px; padding: 18px; margin: 12px 0 16px; }
.od-head-t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.od-no { font-size: 20px; font-weight: 800; color: var(--text-primary); letter-spacing: -.01em; }
.od-date { font-size: 13px; color:var(--text-secondary); }
.od-status { display: inline-block; font-size: 11.5px; font-weight: 800; border:1px solid var(--line-strong); border-radius: 100px; padding: 3px 11px; color: var(--text-primary); }
.od-facts { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
@media (min-width: 620px) { .od-facts { grid-template-columns: 1fr 1fr; } }
.od-fact .fk { font-size: 11px; color:var(--text-muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 700; }
.od-fact .fv { font-size: 13px; color: var(--text-primary); font-weight: 600; margin-top: 3px; }
.od-fact .fv span { display: block; font-weight: 400; color:var(--text-secondary); font-size: 12.5px; }
.od-paid::before { content: "✓ "; font-weight: 900; }

/* per-client group (mirrors cart-coach grouping) */
.od-grp { border:1px solid var(--line-hair); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.od-grp-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 15px; background:var(--bg-surface); border-bottom:1px solid var(--line-hair); }
.od-grp-h .gc { font-size: 14px; font-weight: 800; color: var(--text-primary); }
.od-grp-h .gg { font-size: 12px; color:var(--text-secondary); font-weight: 600; }
.od-grp-h .gs { font-size: 15px; font-weight: 800; color: var(--text-primary); white-space: nowrap; }
.od-line { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; padding: 12px 15px; border-bottom:1px solid var(--line-hair); align-items: center; }
.od-line:last-child { border-bottom: none; }
.od-ph { width: 48px; height: 52px; border-radius: 8px; background:var(--bg-sunken); border:1px solid var(--line-hair); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 9px; }  /* 7.25 ink: a WORD takes the muted rung, not the faint mark - the reasoning is in coach-clients.css */
.od-nm { font-size: 13.5px; font-weight: 700; color: var(--text-primary); line-height: 1.3; }
.od-var { font-size: 12px; color:var(--text-secondary); margin-top: 2px; }
.cprice { font-size: 15px; font-weight: 800; color: var(--text-primary); white-space: nowrap; text-align: right; }
.cprice .old { display: block; font-size: 11.5px; font-weight: 500; color: var(--text-price-was); text-decoration: line-through; }
.cprice .wtag { display: inline-block; font-size: 9.5px; font-weight: 800; color: var(--text-primary); border:1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; margin-left: 5px; vertical-align: middle; }
.od-grp-f { padding: 11px 15px; display: flex; justify-content: flex-end; }
.od-repeat1 { font-size: 12px; font-weight: 700; color: var(--text-primary); text-decoration: underline; }

/* grand total + actions */
.od-tot { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-top:1.5px solid var(--line-strong); padding: 14px 2px 2px; margin-top: 2px; }
.od-tot .l { font-size: 15px; font-weight: 800; color: var(--text-primary); }
.od-tot .l small { display: block; font-size: 11.5px; font-weight: 600; color:var(--text-secondary); }
.od-tot .v { font-size: 24px; font-weight: 800; color: var(--text-primary); }
.od-acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.ord-empty, .ord-err { text-align: center; border:1px solid var(--line-hair); border-radius: 14px; padding: 44px 24px; }
.ord-empty .ei { font-size: 36px; }
.ord-empty .et, .ord-err .et { font-size: 19px; font-weight: 800; color: var(--text-primary); margin: 12px 0 6px; }
.ord-empty .es, .ord-err .es { font-size: 13.5px; color:var(--text-secondary); max-width: 460px; margin: 0 auto 20px; line-height: 1.5; }
.ord-acts-c { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.ord.skel { pointer-events: none; }
.skln { height: 12px; border-radius: 6px; background: var(--bg-rule); margin: 8px 0; }
.skgrp { border:1px solid var(--line-hair); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
</style>
</head>
