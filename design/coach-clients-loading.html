/* client-card skeletons */
.skclist { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
@media (min-width: 640px) { .skclist { grid-template-columns: 1fr 1fr; } }
.skccard { border:1px solid var(--line-hair); border-radius: 14px; padding: 15px 16px; }
.skhd { display: flex; align-items: center; gap: 12px; }
.skav { width: 44px; height: 44px; border-radius: 50%; background:var(--bg-sunken); flex: none; }
.skccard .skline { height: 10px; border-radius: 5px; background: var(--bg-rule); margin: 8px 0; }
.skline.s { width: 45%; } .skline.m { width: 68%; } .skline.l { width: 88%; }
.skacts { display: flex; gap: 9px; margin-top: 16px; }
.skacts i { flex: 1; height: 38px; border-radius: 8px; background:var(--bg-sunken); display: block; }
</style>
</head>
