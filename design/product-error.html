<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Картка товару - помилка (wireframe 3.0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">
<!-- stand chrome only, never part of the system: see design/_stand.css -->
<link rel="stylesheet" href="_stand.css">
</head>
<body>
<!-- WIREFRAME · 3.0 STATE = error (details failed). Exit: «Спробувати ще раз» - flows.md se→qr.
     No dead end. COLOR LAYER: the calm bear instead of a warning glyph (same treatment as the
     listing error), one orange on the retry, the second exit stays ghost. -->
<div class="wf-bar" id="wf-bar"></div>
<div class="wf-canvas">
<header id="wf-header"></header>

<main class="wf-page">
  <nav class="crumb" aria-label="Хлібні крихти">
    <a href="index.html">Головна</a><span class="sep">/</span>
    <a href="catalog-page.html">Каталог</a><span class="sep">/</span>
    <a href="listing.html">Протеїн</a><span class="sep">/</span>
    <span class="cur">Товар</span>
  </nav>

  <!-- the aria-label is what the colour layer keys the bear off (see system/tokens.css) -->
  <section aria-label="Помилка" role="alert">
    <div class="empty" style="margin-top:24px">
      <div class="ei"><img src="visuals/mascot-face-concern.png" alt=""></div>
      <div class="et">Не вдалося завантажити товар</div>
      <div class="es">Перевірте з'єднання з інтернетом і спробуйте ще раз.</div>
      <div class="eact">
        <a class="btn--accent btn dark" href="product.html">Спробувати ще раз</a>
        <a class="btn--outline btn" href="listing.html">До каталогу</a>
      </div>
    </div>
  </section>
</main>

<footer id="wf-footer"></footer>
</div>
<div id="wf-sheet"></div>
<script src="../wireframes/_nav.js"></script>
<script src="system/icons.js"></script>
<script src="system/fields.js"></script>
<script src="_nav.js"></script>
<script>wfHeader(); wfFooter(); wfBar('product.html', 'error');
        uivFixLinks(); uivBar(); uivChrome();</script>
</body>
</html>
