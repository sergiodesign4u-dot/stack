<!-- Built by tools/demo.mjs off design/coach-tariff-cancel.html - not retyped. The body class

<div class="ceov open" id="tf-cancel" role="dialog" aria-modal="true" aria-label="Скасувати підписку Pro" tabindex="-1">
  <div class="cedlg tfdlg">
    <div class="ic" aria-hidden="true"><span class="uiv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2 20.8 12 12 20.8 3.2 12z"></path><path d="M12 8.8 15.2 12 12 15.2 8.8 12z"></path></svg></span></div>
    <h2>Скасувати підписку Pro?</h2>
    <p>Pro залишиться активним до <b>12 липня 2026</b>. Після цього тариф автоматично перейде на <b>Free</b>: гуртові ціни збережуться, але кількість клієнтів у сесії буде обмежена (до 3). Повернути Pro можна будь-коли.</p>
    <div class="act">
      <button class="btn--outline btn" type="button">Залишити Pro</button>
      <a class="btn--outline btn--danger btn" href="../../coach-tariff-free.html">Скасувати підписку</a>
    </div>
  </div>
</div>
