</style>

<body class="coach">
<!-- Built by tools/demo.mjs off design/coach-client-empty.html - not retyped. The body class
     is the screen's own: an organism scoped to it draws nothing without it. -->
<div style="max-width:860px;margin:0 auto;padding:0 16px"><main class="wf-page cc-wrap">
  

  <div class="ch">
    <div class="ch-id">
      <div class="ch-av">А</div>
      <div>
        <div class="ch-name">Андрій</div>
        <span class="ch-goal"><span class="uiv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.3"></circle><circle cx="12" cy="12" r="4"></circle><circle cx="12" cy="12" r=".7" fill="currentColor" stroke="none"></circle></svg></span> Ціль: Набір маси</span>
      </div>
    </div>
    <a class="ch-edit" href="../../../wireframes/coach-client-edit.html">Редагувати клієнта</a>
  </div>

  <p class="cc-note">Ціль клієнта <b>«Набір маси»</b> формує підбір товарів у сесії замовлення.</p>

  <h2 class="oh-h">Історія замовлень клієнта</h2>
  <!-- `.ic` / `<h3>` / `<p>` -> `.ei` / `.et` / `.es` / `.eact`, step 8.25.
       empty-state.css draws this box with those four names and five other
       screens in the colour layer already write them - coach-clients-empty,
       coach-clients-error, listing-empty, listing-error, product-error. This
       one kept the grey original's element-name version, so its whole look was
       coming from five private rules instead. -->
  <div class="empty">
    <div class="ei"><span class="uiv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4 20.3 7.6v8.8L12 20.6 3.7 16.4V7.6z"></path><path d="M3.7 7.6 12 11.8l8.3-4.2"></path><path d="M12 11.8v8.8"></path></svg></span></div>
    <div class="et">Ще немає замовлень</div>
    <div class="es">Для цього клієнта ви ще нічого не замовляли. Створіть сесію - підбір товарів
      автоматично враховуватиме ціль «Набір маси».</div>
    <div class="eact">
      <a class="btn--accent btn--s btn" href="../../coach-session.html"><span class="uiv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.4v15.2"></path><path d="M4.4 12h15.2"></path></svg></span> Нова сесія</a>
    </div>
  </div>
</main></div>
