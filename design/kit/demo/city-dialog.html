<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Діалог міста</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- the frame loads the product's entry point and nothing of the showcase -->
<link rel="stylesheet" href="../../system/index.css">
<style>
  /* the frame IS the viewport, so a fixed panel has nothing to escape into */
  html,body{ margin:0; padding:0; background:var(--bg-page); }
  body{ min-height:100vh; }
</style>
</head>
<body>
<div style="max-width:560px;margin:0 auto"><div class="wf-city open" id="city-dlg" role="dialog" aria-modal="true" aria-label="Оберіть місто"><div class="wf-city-h">Оберіть місто<button class="btn--ghost btn--icon btn--s x" onclick="closeCity()" aria-label="Закрити"><span class="uiv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.4 6.4l11.2 11.2"></path><path d="M17.6 6.4L6.4 17.6"></path></svg></span></button></div><div class="wf-city-b"><input class="field field--s city-search" type="search" placeholder="Пошук міста…" aria-label="Пошук міста"><div class="city-lbl">Популярні міста</div><div class="city-pop"><button class="city-badge" onclick="wfPickCity('Київ')">Київ</button><button class="city-badge" onclick="wfPickCity('Харків')">Харків</button><button class="city-badge" onclick="wfPickCity('Дніпро')">Дніпро</button><button class="city-badge" onclick="wfPickCity('Одеса')">Одеса</button><button class="city-badge" onclick="wfPickCity('Львів')">Львів</button><button class="city-badge" onclick="wfPickCity('Запоріжжя')">Запоріжжя</button><button class="city-badge" onclick="wfPickCity('Кривий Ріг')">Кривий Ріг</button><button class="city-badge" onclick="wfPickCity('Миколаїв')">Миколаїв</button></div><div class="city-lbl">Усі міста (А–Я)</div><div class="city-list"><button class="city-az" onclick="wfPickCity('Вінниця')">Вінниця</button><button class="city-az" onclick="wfPickCity('Дніпро')">Дніпро</button><button class="city-az" onclick="wfPickCity('Житомир')">Житомир</button><button class="city-az" onclick="wfPickCity('Запоріжжя')">Запоріжжя</button><button class="city-az" onclick="wfPickCity('Івано-Франківськ')">Івано-Франківськ</button><button class="city-az" onclick="wfPickCity('Кам'янець')">Кам'янець</button><button class="city-az" onclick="wfPickCity('Київ')">Київ</button><button class="city-az" onclick="wfPickCity('Кременчук')">Кременчук</button><button class="city-az" onclick="wfPickCity('Кривий Ріг')">Кривий Ріг</button><button class="city-az" onclick="wfPickCity('Луцьк')">Луцьк</button><button class="city-az" onclick="wfPickCity('Львів')">Львів</button><button class="city-az" onclick="wfPickCity('Миколаїв')">Миколаїв</button><button class="city-az" onclick="wfPickCity('Одеса')">Одеса</button><button class="city-az" onclick="wfPickCity('Полтава')">Полтава</button><button class="city-az" onclick="wfPickCity('Рівне')">Рівне</button><button class="city-az" onclick="wfPickCity('Суми')">Суми</button><button class="city-az" onclick="wfPickCity('Тернопіль')">Тернопіль</button><button class="city-az" onclick="wfPickCity('Ужгород')">Ужгород</button><button class="city-az" onclick="wfPickCity('Харків')">Харків</button><button class="city-az" onclick="wfPickCity('Херсон')">Херсон</button><button class="city-az" onclick="wfPickCity('Хмельницький')">Хмельницький</button><button class="city-az" onclick="wfPickCity('Черкаси')">Черкаси</button><button class="city-az" onclick="wfPickCity('Чернівці')">Чернівці</button><button class="city-az" onclick="wfPickCity('Чернігів')">Чернігів</button></div><div class="city-note">Доставка Новою Поштою по всій Україні - знайдемо будь-яке місто через пошук.</div></div></div></div>
<!-- The frame loads exactly what a coloured product screen loads, in the same order,
     and calls the same initialisers. Anything less and the demo is a photograph:
     the price slider, the checkboxes and the switch are all JS-driven, and a stand
     that shows them without their behaviour shows something the product does not have. -->
<script src="../../../wireframes/_nav.js"></script>
<script src="../../system/icons.js"></script>
<script src="../../system/marks.js"></script>
<script src="../../system/fields.js"></script>
<script src="../../system/menu.js"></script>
<script src="../../_nav.js"></script>
<script>
(function(){
  /* 7.87: the first list here was all `uiv*` and the steppers stayed dead, because the
     behaviour of the cart and the checkout is bound by `wf*` functions in the prototype
     layer - `wfCart` wants a `.cart-drawer` holding `.ci[data-unit]` and binds a
     delegated click on it. A demo that shows a control and does not run its binder shows
     something the product does not have. Both families, in the order a screen calls them. */
  var init = ['wfCart','wfCheckout','wfAuth','wfPdpModals','wfAddrDialog','wfProfileDialogs',
              'wfToasts','uivFixLinks','uivChrome','uivCurrency','uivPriceSlider','uivCheckboxes',
              'uivSwitches','uivSegments','uivRadioGroups','uivDisclosures','uivFav','uivCrumbs',
              'uivCart','uivCheckout','uivPdp','uivPdpTabs','uivStickyHeader','uivPatchMenus',
              'uivToastMarks','uivDeadLinks','uivFooterIcons','uivMascot','uivAnchorScroll'];
  init.forEach(function(n){ try{ if (typeof window[n] === 'function') window[n](); }catch(e){} });
  /* 7.87: `uivIcons` walks six named ids and nothing else, so a demo that has none of
     them keeps its emoji. That is the FOURTH hand-written list this pass has found -
     after the focus ring's thirteen selectors, `UIV_SIGN_ONLY`, and the Escape handler's
     eleven calls. Here the frame simply asks it to walk the whole body. */
  try { if (typeof uivIcons === 'function') uivIcons(document.body); } catch(e) {}
  try { if (typeof uivMarks === 'function') uivMarks(document.body); } catch(e) {}
  /* A stand must not navigate: the checkout's «Отримати код» is a submit button, and
     pressing the first control a reader reaches blanked the demo. */
  document.querySelectorAll('form').forEach(function(f){
    f.addEventListener('submit', function(e){ e.preventDefault(); });
  });
})();
</script>
</body>
</html>
