<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Вкладки товару</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- the frame loads the product's entry point and nothing of the showcase -->
<link rel="stylesheet" href="../../system/index.css">
<style>
  /* the frame IS the viewport, so a fixed panel has nothing to escape into */
  html,body{ margin:0; padding:0; background:var(--bg-page); }
  body{ min-height:100vh; }
</style>
</head>
<body>
<!-- 8.33: the strip declares `top: 112px`, which is the height of the header shelf
     it lives under on `design/product.html`. With nothing above it the sticky rule
     pushes it DOWN to 112 at scroll 0 and it lands on whatever follows - which is
     what happened the moment `.pdp` was added below. The spacer is that shelf, and
     it is a spacer rather than a copy of the header for the same reason the columns
     below are stand-ins: this frame is about the strip. -->
<div style="height:112px"></div>
<nav class="pdp-tabs" aria-label="Розділи товару" data-uiv-stick="1" style="top: 112px; --shelf-top: 112px; --shelf-h: 55px;">
    <a class="on" href="#pro">Про товар</a>
    <a href="#sklad">Склад</a>
    <a href="#doz">Дозування</a>
    <a href="#spec">Характеристики</a>
    <a href="#rev">Відгуки</a>
    <a href="#qa">Питання</a>
    <span class="tsp"></span>
    <!-- the shelf repeats the price the way the buy box states it: struck old price +
         cut above, the live (accent, because reduced) figure under them -->
    <span class="tprice">
      <span class="told">1 520 ₴</span><span class="tcut">−15%</span>
      <b class="tnew">1 290 <span class="uiv-cur">₴</span></b>
    </span>
    <a class="tbuy" href="../../cart.html">У кошик</a>
  </nav>
<!-- 8.33: `.pdp` is the block the strip sits ABOVE, and in `design/product.html` the
     two are siblings in exactly this order - the strip first, the layout under it.
     That order is the whole reason they share a file: from 960 the grid moves the
     buy rail into a second column, the purchase stops being in front of the reader,
     and the strip answers by growing a price and a buy button. Shown apart, the
     strip's own media query looks arbitrary. Both columns here are stand-ins: the
     real gallery and buy box would drag two more files into a frame about the strip. -->
<div class="pdp">
  <div style="border:1px dashed var(--line-strong); border-radius:var(--radius-12); padding:var(--space-24); color:var(--text-secondary); font-size:var(--fs-14)">колонка товару - <b>minmax(0, 1fr)</b></div>
  <aside style="border:1px dashed var(--line-strong); border-radius:var(--radius-12); padding:var(--space-24); color:var(--text-secondary); font-size:var(--fs-14)">рейка покупки <b>.bb</b> - 420 від 960, 540 від 1200, 580 від 1440</aside>
</div>
<!-- The frame loads exactly what a coloured product screen loads, in the same order,
     and calls the same initialisers. Anything less and the demo is a photograph:
     the price slider, the checkboxes and the switch are all JS-driven, and a stand
     that shows them without their behaviour shows something the product does not have. -->
<script src="../../../wireframes/_nav.js"></script>
<script src="../../system/theme.js"></script>
<script src="../../system/icons.js"></script>
<script src="../../system/marks.js"></script>
<script src="../../system/fields.js"></script>
<script src="../../system/menu.js"></script>
<script src="../../_nav.js"></script>
<script src="_boot.js"></script>
</body>
</html>
