<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Клієнти тренера - список</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- the frame loads the product's entry point and nothing of the showcase -->
<link rel="stylesheet" href="../../system/index.css">
<style>
  /* the frame IS the viewport, so a fixed panel has nothing to escape into */
  html,body{ margin:0; padding:0; background:var(--bg-page); }
  body{ min-height:100vh; }
</style>
</head>
<body class="coach">
<!-- Built by tools/demo.mjs off design/coach-clients.html - not retyped. The body class
     is the screen's own: an organism scoped to it draws nothing without it. -->
<div style="max-width:732px;margin:0 auto;padding:0 16px"><div class="acc-main">
      <div class="cl-top">
        <div>
          <h1 class="cl-h1">Клієнти</h1>
          <p class="cl-sub">Збережені клієнти з їхніми цілями та історією замовлень.</p>
        </div>
        <!-- ONE ACCENT ON THE SCREEN, AND IT IS THE LIST'S OWN ADD ACTION.
             Before: six accent grounds inside <main>, five of them buttons, four
             of those carrying the same word and the same href="coach-session.html".
             account-addresses.html is this exact shape - a list of saved records
             with per-card actions - and it has ONE accent, `.addr-add`, with every
             per-card action `btn--outline`. So the accent moves here.
             The second «＋ Нова сесія» that stood beside this one is DELETED: it
             was a third copy of the button `wfCoachNav()` already emits full-width
             directly above, 234px away. Two identical adjacent primaries is
             principle 2 («exactly one main action per screen») failing out loud. -->
        <div class="cl-acts">
          <a class="btn--accent btn--s btn" href="../../../wireframes/coach-client-new.html"><span class="uiv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.4v15.2"></path><path d="M4.4 12h15.2"></path></svg></span> Додати клієнта</a>
        </div>
      </div>

      <!-- search / filter row -->
      <div class="cl-tools">
        <label class="cl-search">
          <span aria-hidden="true"><span class="uiv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.8"></circle><path d="M20.5 20.5l-4.4-4.4"></path></svg></span></span>
          <input type="search" placeholder="Пошук клієнта за іменем…" aria-label="Пошук клієнта">
        </label>
      </div>

      <!-- CLIENT CARDS -->
      <div class="clist">

        <article class="ccard">
          <div class="ccard-hd">
            <div class="ccard-av">А</div>
            <div>
              <div class="ccard-nm">Андрій</div>
              <span class="ccard-goal"><span class="uiv-ic" data-uiv-goal="trending"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l5-5 3.5 3.5L20 7"></path><path d="M15 7h5v5"></path></svg></span> Набір маси</span>
            </div>
          </div>
          <div class="ccard-meta"><b>8 замовлень</b><span class="dot">·</span>останнє 12 черв. 2026</div>
          <div class="ccard-acts">
            <a class="btn--outline btn--s btn" href="../../coach-client.html">Профіль</a>
            <a class="btn--outline btn--s btn" href="../../coach-session.html">Нова сесія</a>
          </div>
        </article>

        <article class="ccard">
          <div class="ccard-hd">
            <div class="ccard-av">М</div>
            <div>
              <div class="ccard-nm">Марія</div>
              <span class="ccard-goal"><span class="uiv-ic" data-uiv-goal="flame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c1.4 4.3 5.7 6.1 5.7 11.3a5.7 5.7 0 0 1-11.4 0c0-2.1.7-3.4 1.6-4.3.4 1.4 1.4 2.3 2.4 2.6C9.5 10.2 10.3 6.3 12 3.5z"></path></svg></span> Схуднення</span>
            </div>
          </div>
          <div class="ccard-meta"><b>5 замовлень</b><span class="dot">·</span>останнє 3 черв. 2026</div>
          <div class="ccard-acts">
            <a class="btn--outline btn--s btn" href="../../coach-client.html">Профіль</a>
            <a class="btn--outline btn--s btn" href="../../coach-session.html">Нова сесія</a>
          </div>
        </article>

        <article class="ccard">
          <div class="ccard-hd">
            <div class="ccard-av">І</div>
            <div>
              <div class="ccard-nm">Ігор</div>
              <span class="ccard-goal"><span class="uiv-ic" data-uiv-goal="pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12h4l2-5 3 10 2.5-5H21"></path></svg></span> Витривалість</span>
            </div>
          </div>
          <div class="ccard-meta"><b>2 замовлення</b><span class="dot">·</span>останнє 28 трав. 2026</div>
          <div class="ccard-acts">
            <a class="btn--outline btn--s btn" href="../../coach-client.html">Профіль</a>
            <a class="btn--outline btn--s btn" href="../../coach-session.html">Нова сесія</a>
          </div>
        </article>

      </div>
    </div></div>
<!-- The frame loads exactly what a coloured product screen loads, in the same order,
     and calls the same initialisers. Anything less and the demo is a photograph. -->
<script src="../../../wireframes/_nav.js"></script>
<script src="../../system/theme.js"></script>
<script src="../../system/icons.js"></script>
<script src="../../system/marks.js"></script>
<script src="../../system/fields.js"></script>
<script src="../../system/menu.js"></script>
<script src="../../_nav.js"></script>
<script src="_boot.js"></script>
</body>
</html>
