<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Клієнти - порожньо - Кабінет тренера - Stack (wireframe 5.3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">
<!-- stand chrome only, never part of the system: see design/_stand.css -->
<link rel="stylesheet" href="_stand.css">
<style>
.acc { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 16px; }
@media (min-width: 960px) { .acc { grid-template-columns: 268px 1fr; gap: 28px; } }
.acc-nav { align-self: start; }
@media (min-width: 960px) { .acc-nav { position: sticky; top: 120px; } }
.acc-prof { border:1px solid var(--line-hair); border-radius: 14px; padding: 15px 16px; display: flex; gap: 13px; align-items: center; }
.acc-prof .av { width: 48px; height: 48px; border-radius: 50%; background:var(--bg-sunken); border:1px solid var(--line-hair); flex: none; display: flex; align-items: center; justify-content: center; color:var(--text-muted); font-size: 19px; }
.acc-prof .nm { font-weight: 800; color: var(--text-primary); font-size: 15px; }
.acc-prof .ph { font-size: 12px; color:var(--text-secondary); margin-top: 2px; }
.acc-tier { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 11px; font-weight: 800; border:1.5px solid var(--line-strong); border-radius: 100px; padding: 2px 9px; color: var(--text-primary); }
.acc-links { margin-top: 12px; border:1px solid var(--line-hair); border-radius: 14px; overflow: hidden; }
.acc-link { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 13px 15px; border-bottom:1px solid var(--line-hair); font-size: 14px; font-weight: 600; color: var(--text-primary); background: var(--bg-page); }
.acc-link:last-child { border-bottom: none; }
.acc-link .ic { width: 20px; text-align: center; color:var(--text-secondary); font-size: 15px; }
.acc-link .ct { margin-left: auto; font-size: 12px; font-weight: 800; color:var(--text-muted); }
.acc-link .ar { margin-left: 8px; color: var(--mark-faint); font-weight: 700; }
@media (min-width: 960px) { .acc-link .ar { display: none; } }
.acc-link[aria-current="page"] { background:var(--bg-sunken); }
.acc-link[aria-current="page"] .ic { color: var(--text-primary); }
.acc-link.logout { color:var(--text-secondary); font-weight: 700; }
.cl-h1 { font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -.01em; margin-bottom: 4px; }
.empty p.lead { font-size: 13.5px; color:var(--text-secondary); max-width: 46ch; margin: 0 auto 16px; }
</style>
</head>
<body>
<!-- WIREFRAME · node 5.3 Клієнти - EMPTY (no clients yet). Not a dead end:
     big «＋ Додати клієнта» + start a session. Private → noindex. -->
<div class="wf-bar" id="wf-bar"></div>
<div class="wf-canvas">
<header id="wf-header"></header>

<main class="wf-page">
  <nav class="crumb" aria-label="Хлібні крихти">
    <a href="index.html">Головна</a><span class="sep"></span>
    <a href="coach-home.html">Кабінет тренера</a><span class="sep"></span>
    <span class="cur">Клієнти</span>
  </nav>

  <div class="acc">
    <aside class="acc-nav" id="acc-nav"></aside>

    <div class="acc-main">
      <h1 class="cl-h1">Клієнти</h1>

      <div class="empty">
        <div class="ei" aria-hidden="true">👥</div>
        <div class="et">У вас ще немає клієнтів</div>
        <p class="lead">Додайте клієнта з його ціллю (набір маси, схуднення, витривалість…) - і формуйте для нього замовлення за гуртовими цінами в кілька дотиків. Історія кожного клієнта зберігається окремо.</p>
        <div class="eact">
          <a class="btn--accent btn--s btn dark" href="coach-session-addclient.html">＋ Додати клієнта</a>
          <a class="btn--outline btn--s btn" href="coach-home.html">← До кабінету</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer id="wf-footer"></footer>
</div>

<script src="../wireframes/_nav.js"></script>
<script src="system/theme.js"></script>
<script src="system/icons.js"></script>
<script src="system/marks.js"></script>
<script src="system/fields.js"></script>
<script src="_nav.js"></script>
<script>wfHeader('coach'); wfFooter(); wfCoachNav('clients', {counts:{clients:0,orders:6,wishlist:4}}); wfBar('coach-clients.html','empty');  uivFixLinks(); uivBar(); uivChrome();
</script>
</body>
</html>
