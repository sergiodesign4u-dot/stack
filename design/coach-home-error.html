<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кабінет тренера - помилка - Stack (wireframe 5.2 · error)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">
<!-- stand chrome only, never part of the system: see design/_stand.css -->
<link rel="stylesheet" href="_stand.css">
<style>
/* node 5.2 Кабінет тренера - ERROR. No dead end: retry → base + go home. Greyscale. */
.cerr { max-width: 520px; margin: 40px auto 60px; text-align: center; border:1.5px dashed var(--line-strong); border-radius: 16px; padding: 44px 26px; }
.cerr .ic { width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 50%; border:1.5px solid var(--line-strong); display: flex; align-items: center; justify-content: center; font-size: 28px; color:var(--text-secondary); }
.cerr h1 { font-size: 21px; font-weight: 800; color: var(--text-primary); }
.cerr p { font-size: 14px; color:var(--text-secondary); margin-top: 10px; line-height: 1.6; }
.cerr .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
</style>
</head>
<body>
<!-- WIREFRAME · node 5.2 Кабінет тренера - ERROR. Never a dead end: retry + home. -->
<div class="wf-bar" id="wf-bar"></div>
<div class="wf-canvas">
<header id="wf-header"></header>

<main class="wf-page">
  <nav class="crumb" aria-label="Хлібні крихти">
    <a href="index.html">Головна</a><span class="sep"></span>
    <span class="cur">Кабінет тренера</span>
  </nav>

  <section class="cerr" role="alert">
    <div class="ic" aria-hidden="true">⚠</div>
    <h1>Не вдалося завантажити кабінет</h1>
    <p>Сталася помилка під час завантаження даних кабінету тренера. Перевірте з'єднання та спробуйте ще раз.</p>
    <div class="acts">
      <a class="btn--accent btn--s btn dark" href="coach-home.html">Спробувати ще раз</a>
      <a class="btn--outline btn--s btn" href="index.html">На головну</a>
    </div>
  </section>
</main>

<footer id="wf-footer"></footer>
</div>

<script src="../wireframes/_nav.js"></script>
<script src="system/icons.js"></script>
<script src="system/marks.js"></script>
<script src="system/fields.js"></script>
<script src="_nav.js"></script>
<script>wfHeader('coach'); wfFooter(); wfBar('coach-home.html','error');  uivFixLinks(); uivBar(); uivChrome();
</script>
</body>
</html>
