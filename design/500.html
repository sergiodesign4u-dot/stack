<!-- ============================================================
  WIREFRAME · node S · 500. МІНІМАЛЬНИЙ ШАБЛОН, НЕЗАЛЕЖНИЙ ВІД БЕКЕНДУ (він сам
  може лежати): без шапки, без підвалу, без даних каталогу. Гола центрована
  колонка .sys-min - бо зламався сам магазин, і смуга навігації пропонувала б
  двері, які не відчиняються. HTTP 500 + noindex. Спокійно, один ясний крок.

  Body drawn by system-page.css: .sys-min · .sys-logo · .sys-code · .sys-h ·
  .sys-s · .sys-foot. Ряд дій - патерн .actions .actions--center
  (patterns/action-row.css), не власний контейнер: сірий .sys-acts це один з
  53 імен, під якими та сама композиція стоїть у продукті.

  H1 - «Щось пішло не так», а не сіре «Помилка на сервері». Обидва власники
  рядків збігаються: voice/docs/microcopy.md (інтерфейсні рядки) і
  ia/docs/pages/system.md (SEO-копія); сірий не є власником ані того, ані того
  роду рядків. Title приведено у відповідність.

  Ранг кнопок прочитано з сірого, а не обрано тут: btn dark -> btn--accent,
  решта -> btn--outline.

  Тихий рядок під діями - .sys-foot. Сірий пише його як .sys-s з інлайном на
  верхній відступ і кегль, і без того інлайну виходить чотири пікселі повітря
  замість вісімнадцяти: .sys-min має gap --space-4, а .sys-s не має верхнього
  відступу взагалі. Тобто інлайн був не оздобленням, а загубленим правилом.
============================================================ -->
