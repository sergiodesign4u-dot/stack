<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Картка товару - завантаження (wireframe 3.0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">
<!-- stand chrome only, never part of the system: see design/_stand.css -->
<link rel="stylesheet" href="_stand.css">
</head>
<body>
<!-- WIREFRAME · 3.0 STATE = loading (trust details). Skeletons hold the base layout, so
     nothing jumps when the data lands. Resolves to base or error.
     COLOR LAYER: the skeleton is warm neutral, never a grey box on a warm page, and it
     carries NO accent - there is nothing to act on yet (voice.md 5, states tell the truth). -->
<div class="wf-bar" id="wf-bar"></div>
<div class="wf-canvas">
<header id="wf-header"></header>

<main class="wf-page">
  <nav class="crumb" aria-label="Хлібні крихти">
    <a href="index.html">Головна</a><span class="sep"></span>
    <a href="catalog-page.html">Каталог</a><span class="sep"></span>
    <a href="listing.html">Протеїн</a><span class="sep"></span>
    <span class="cur">Завантажуємо…</span>
  </nav>

  <div class="pdp" aria-busy="true" aria-label="Завантаження товару">
    <div class="gal">
      <div class="gmain skpulse"></div>
      <div class="gthumbs"><div class="gthumb skpulse"></div><div class="gthumb skpulse"></div><div class="gthumb skpulse"></div><div class="gthumb skpulse"></div></div>
    </div>
    <div class="bb skpulse">
      <div class="skline s" style="margin-bottom:10px"></div>
      <div class="skline l" style="height:22px"></div>
      <div class="skline m"></div>
      <div class="skline" style="height:60px;margin:14px 0"></div>
      <div class="skline s" style="height:30px;width:40%"></div>
      <div class="skline" style="height:46px;margin:16px 0"></div>
      <div class="skline l" style="height:50px"></div>
      <div class="skline" style="height:120px;margin-top:16px"></div>
    </div>
  </div>
  <p class="loadnote">Завантажуємо товар…</p>
</main>

<footer id="wf-footer"></footer>
</div>
<div id="wf-sheet"></div>
<script src="../wireframes/_nav.js"></script>
<script src="system/icons.js"></script>
<script src="system/marks.js"></script>
<script src="system/fields.js"></script>
<script src="_nav.js"></script>
<!-- uivPdp() is deliberately NOT called: it would drop the real product photo into the
     skeleton frame, and a loading state that already shows the product is a lie. -->
<script>wfHeader(); wfFooter(); wfBar('product.html', 'loading');
        uivFixLinks(); uivBar(); uivChrome();</script>
</body>
</html>
