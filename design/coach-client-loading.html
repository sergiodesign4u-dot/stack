<title>Профіль клієнта - завантаження… (wireframe 5.4 · loading)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">
<!-- stand chrome only, never part of the system: see design/_stand.css -->
<link rel="stylesheet" href="_stand.css">
<style>
/* node 5.4 Профіль клієнта - LOADING: static skeleton of the history. */
.cc-wrap { max-width: 900px; }
.ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 8px 0 6px; }
.ch-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
.ch-av { width: 56px; height: 56px; border-radius: 50%; background:var(--bg-sunken); border:1px solid var(--line-hair); flex: none; display: flex; align-items: center; justify-content: center; color:var(--text-muted); font-size: 21px; font-weight: 800; }
.ch-name { font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -.01em; }
/* 7.18: the ink ring was the grey layer's `--dark` translated by value. A small
   outlined label is badge.css:163's shape - a `--line-strong` HAIRLINE - and an
   ink ring at 1.5px made a chip shout louder than the card holding it. */
.ch-goal { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; font-weight: 800; border:1px solid var(--line-strong); border-radius: 100px; padding: 3px 11px; color: var(--text-primary); }
.ch-edit { font-size: 12.5px; font-weight: 700; color: var(--text-primary); border:1.5px solid var(--line-strong); border-radius: 8px; padding: 9px 15px; white-space: nowrap; }
.cc-cta { margin: 18px 0 26px; }
.cc-cta .btn { padding: 13px 22px; }
.oh-h { font-size: 15px; font-weight: 800; color: var(--text-primary); margin: 0 0 12px; }

/* skeleton */
.sk { background:var(--bg-sunken); border-radius: 6px; }
.ohist { display: flex; flex-direction: column; gap: 14px; }
.skcard { border:1px solid var(--line-hair); border-radius: 12px; padding: 15px 16px; }
.sk-top { display: flex; justify-content: space-between; }
.sk-line { height: 13px; }
.sk-row { display: grid; grid-template-columns: 40px 1fr 70px; gap: 11px; align-items: center; padding: 12px 0; border-top:1px solid var(--line-hair); margin-top: 10px; }
.sk-ph { width: 40px; height: 40px; border-radius: 7px; }
.sk-actions { display: flex; gap: 9px; margin-top: 14px; }
.sk-btn { height: 38px; width: 120px; border-radius: 8px; }
.load-note { text-align: center; font-size: 12.5px; color:var(--text-muted); margin-top: 20px; }
</style>
</head>
<body>
<!-- WIREFRAME · node 5.4 Профіль клієнта (LOADING). Static skeleton of client order history. -->

  <div class="ch">

      <div class="ch-av">А</div>

        <div class="ch-name">Андрій</div>
        <span class="ch-goal">🎯 Ціль: Набір маси</span>
      </div>
    </div>
    <a class="ch-edit" href="../wireframes/coach-client-edit.html">Редагувати клієнта</a>
  </div>

  <div class="cc-cta"><a class="btn--accent btn--s btn dark" href="coach-session.html">＋ Нова сесія</a></div>

  <h2 class="oh-h">Історія замовлень клієнта</h2>
  <div class="ohist" aria-hidden="true">
    <div class="skcard">
      <div class="sk-top"><div class="sk sk-line" style="width:130px"></div><div class="sk sk-line" style="width:90px"></div></div>
      <div class="sk-row"><div class="sk sk-ph"></div><div class="sk sk-line" style="width:70%"></div><div class="sk sk-line"></div></div>
      <div class="sk-row"><div class="sk sk-ph"></div><div class="sk sk-line" style="width:55%"></div><div class="sk sk-line"></div></div>
      <div class="sk-actions"><div class="sk sk-btn"></div><div class="sk sk-btn" style="width:90px"></div></div>
    </div>
    <div class="skcard">
      <div class="sk-top"><div class="sk sk-line" style="width:130px"></div><div class="sk sk-line" style="width:90px"></div></div>
      <div class="sk-row"><div class="sk sk-ph"></div><div class="sk sk-line" style="width:65%"></div><div class="sk sk-line"></div></div>
      <div class="sk-row"><div class="sk sk-ph"></div><div class="sk sk-line" style="width:50%"></div><div class="sk sk-line"></div></div>
      <div class="sk-actions"><div class="sk sk-btn"></div><div class="sk sk-btn" style="width:90px"></div></div>
    </div>
  </div>
  <p class="load-note">Завантажуємо історію клієнта…</p>
</main>

<footer id="wf-footer"></footer>
</div>
