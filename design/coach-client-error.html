<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Профіль клієнта - помилка (wireframe 5.4 · error)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">
<!-- stand chrome only, never part of the system: see design/_stand.css -->
<link rel="stylesheet" href="_stand.css">
<style>
/* node 5.4 Профіль клієнта - ERROR: history failed to load.
   Not a dead end → «Спробувати ще» → base + fallback session CTA. */
.cc-wrap { max-width: 900px; }
.ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 8px 0 6px; }
.ch-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
.ch-av { width: 56px; height: 56px; border-radius: 50%; background:var(--bg-sunken); border:1px solid var(--line-hair); flex: none; display: flex; align-items: center; justify-content: center; color:var(--text-muted); font-size: 21px; font-weight: 800; }
.ch-name { font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -.01em; }
.ch-goal { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; font-weight: 800; border:1.5px solid var(--line-inverse); border-radius: 100px; padding: 3px 11px; color: var(--text-primary); }
.ch-edit { font-size: 12.5px; font-weight: 700; color: var(--text-primary); border:1.5px solid var(--line-strong); border-radius: 8px; padding: 9px 15px; white-space: nowrap; }
.oh-h { font-size: 15px; font-weight: 800; color: var(--text-primary); margin: 22px 0 12px; }

.err { text-align: center; border:1px solid var(--line-strong); border-radius: 14px; padding: 40px 22px; }
.err .ic { font-size: 32px; color: #cfcfcf; }
.err h3 { font-size: 17px; font-weight: 800; color: var(--text-primary); margin: 12px 0 6px; }
.err p { font-size: 13.5px; color:var(--text-secondary); line-height: 1.6; max-width: 420px; margin: 0 auto 20px; }
.err-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.err-btns .btn { padding: 13px 24px; }
</style>
</head>
<body>
<!-- WIREFRAME · node 5.4 Профіль клієнта (ERROR). History failed. Retry → base. Never a dead end. -->
<div class="wf-bar" id="wf-bar"></div>
<div class="wf-canvas">
<header id="wf-header"></header>

<main class="wf-page cc-wrap">
  <nav class="crumb" aria-label="Хлібні крихти">
    <a href="index.html">Головна</a><span class="sep"></span>
    <a href="coach-home.html">Кабінет тренера</a><span class="sep"></span>
    <a href="coach-clients.html">Клієнти</a><span class="sep"></span>
    <span class="cur">Андрій</span>
  </nav>

  <div class="ch">
    <div class="ch-id">
      <div class="ch-av">А</div>
      <div>
        <div class="ch-name">Андрій</div>
        <span class="ch-goal">🎯 Ціль: Набір маси</span>
      </div>
    </div>
    <a class="ch-edit" href="../wireframes/coach-client-edit.html">Редагувати клієнта</a>
  </div>

  <h2 class="oh-h">Історія замовлень клієнта</h2>
  <div class="err" role="alert">
    <div class="ic">⚠️</div>
    <h3>Не вдалося завантажити історію клієнта</h3>
    <p>Стався тимчасовий збій. Перевірте з'єднання та спробуйте ще раз - або одразу
      створіть нову сесію для клієнта.</p>
    <div class="err-btns">
      <a class="btn--accent btn--s btn dark" href="coach-client.html">Спробувати ще раз</a>
      <a class="btn--outline btn--s btn" href="coach-session.html">＋ Нова сесія</a>
    </div>
  </div>
</main>

<footer id="wf-footer"></footer>
</div>

<script src="../wireframes/_nav.js"></script>
<script src="system/theme.js"></script>
<script src="system/icons.js"></script>
<script src="system/marks.js"></script>
<script src="system/fields.js"></script>
<script src="_nav.js"></script>
<script>wfHeader('coach'); wfFooter(); wfBar('coach-client.html', 'error');  uivFixLinks(); uivBar(); uivChrome();
</script>
</body>
</html>
