    - paragraph [ref=f4e157]: "Сторінку тримає просторове правило: ліва колонка - там, де ви вводите, права - там, де вирішуєте. Тому зліва немає жодної залитої дії: обраний спосіб доставки чи оплати позначено так само, як позначається вибір скрізь у продукті - оранжевим контуром, - а єдиний залитий оранжевий на сторінці це «Підтвердити замовлення» у грошовій колонці. Вхід - не покупка, тож «Отримати код» - чорнильна кнопка: один акцент, одне значення. Уся права колонка обчислюється: зміна кількості, вибір доставки, списання бонусів і додавання з апселу одразу переписують «До сплати» й нарахування. Апсел «Не забудьте додати» — полиця, а не коробка: канонічні картки товару без панелі позаду, бо додаток - це теж товар."
