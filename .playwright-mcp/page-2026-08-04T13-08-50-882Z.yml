      - generic [ref=f12e1042]:
        - paragraph [ref=f12e1043]: Харчова добавка для спортсменів №1 – це протеїн. Саме вона стала наріжним каменем започаткування індустрії спортивного харчування, яка зародилася в середині минулого століття в США. Тож назва нашого інтернет-магазину – Belok, невипадкова. Ми були одним з перших магазинів, що відкрилися в Україні, і протягом багатьох років поспіль є лідером цього сегменту українського ринку.
        - heading "Навіщо потрібно приймати протеїн" [level=2] [ref=f12e1044]
        - paragraph [ref=f12e1045]: Спортивне харчування – протеїн, спочатку почав вироблятися для силових атлетів та бодібілдерів. Добавка, що містить тваринний або рослинний білок, допомагає ефективно збільшувати м'язову масу. Але сьогодні її приймають не лише для цього. Спортсмени та фітнесисти п'ють цю добавку для більш швидкого відновлення м'язової тканини після важких фізичних навантажень, а також для усунення нічного катаболізму м'язів. Білок також допомагає тим, хто займається фізкультурою з метою схуднути.
        - heading "Вживання протеїну не лише спортсменами" [level=2] [ref=f12e1046]
        - paragraph [ref=f12e1047]: "Не варто дивуватися, але добавка спортивного харчування Протеїн сьогодні застосовується в лікуванні таких захворювань як:"
        - list [ref=f12e1048]:
          - listitem [ref=f12e1049]: ожиріння, цукровий діабет ІІ типу;
          - listitem [ref=f12e1050]: атеросклероз, гіпертензія;
          - listitem [ref=f12e1051]: остеопороз;
          - listitem [ref=f12e1052]: жирова хвороба печінки;
          - listitem [ref=f12e1053]: хронічні запалення шлунково-кишкового тракту.
        - paragraph [ref=f12e1054]: Протеїн також допомагає збалансувати харчовий раціон людей похилого віку. Достатня кількість білка допомагає підтримувати нормальну швидкість обмінних процесів, загальмувати вікову втрату м'язової маси, надати бадьорості, покращити роботу мозку, нормалізувати сон.
        - heading "Скільки протеїну можна пити на день?" [level=2] [ref=f12e1055]
        - paragraph [ref=f12e1056]: Для звичайної людини добова норма протеїну з урахуванням білка з продуктів харчування становить 1-1,5 г на кг маси тіла на день. Для тих, хто збільшує м'язову масу норма білка підвищується до 2-3 г/кг. Тим, хто худне, рекомендується протягом дня збивати апетит протеїновими батончиками без цукру або протеїновими добавками для жінок, а перед сном пити казеїн у зазначеній на етикетці добавки інструкції.
        - heading "Чи є в добавки Протеїн протипоказання та побічні ефекти?" [level=2] [ref=f12e1057]
        - paragraph [ref=f12e1058]: Прийом протеїнової добавки спортхарчу заборонено при захворюваннях, що обмежують вживання білка. Побічні ефекти можливі при дуже серйозному передозуванні, яке викликає білкове отруєння. Його симптоми – нудота, болі під ребрами, метеоризм, помутніння сечі, розлад ШКТ, чергування жару з ознобом.
        - heading "Який протеїн краще швидкий, комплексний чи повільний?" [level=2] [ref=f12e1059]
        - paragraph [ref=f12e1060]: Все залежить від мети прийому. Для набору маси краще купити протеїн швидкого типу – сироватковий. Тим, хто худне обов'язково потрібний повільний молочний білок — казеїн. Для веганів випускають добавки із рослинного білка. Швидкість його засвоєння оцінюється як середня. Не спортсменам рекомендують пити комплексний протеїн.
        - heading "Види та асортимент протеїну у нашому інтернет магазині" [level=2] [ref=f12e1061]
        - paragraph [ref=f12e1062]: "Харчові протеїни класифікують таким чином:"
        - list [ref=f12e1063]:
          - listitem [ref=f12e1064]: за походженням – сироваткові, цільномолочні, тваринні, рослинні;
          - listitem [ref=f12e1065]: за швидкістю засвоєння – швидкі, повільні, комплексні;
          - listitem [ref=f12e1066]: формою – порошок, рідина, батончик;
          - listitem [ref=f12e1067]: по включенню до добавки додаткових речовин, що допомагають схуднути – для жінок (комбінований).
        - paragraph [ref=f12e1068]: У нашому магазині представлений широкий асортимент харчових білкових добавок, у тому числі найпопулярніші бренди спортхарчу за відгуками та обсягами продажів – Optimum Nutrition, BSN, Power Pro.
