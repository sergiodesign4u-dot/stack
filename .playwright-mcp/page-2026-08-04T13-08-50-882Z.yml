          - generic [ref=f12e1023]: Покупал двойной шоколад-кокос. После отзывов о том, что говяжий протеин имеет специфический вкус, относился настороженно. По факту, запах говядины у порошка немного есть, если после вскрытия банки понюхать. В готовом коктейле какого-то неприятного запаха или вкуса не чувствую, сам вкус шоколад-кокос..
