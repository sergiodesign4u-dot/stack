    - paragraph [ref=f49e203]: "Кабінет - не вітрина, тому колір тут розкладено інакше. Оранжевий лишається тим, чим був завжди: дія і місце, де ви стоїте (повторити замовлення, у кошик, поточний розділ). Золото (та сама фарба, що й бонусна цифра на оформленні) веде історію лояльності: баланс, прогрес, досягнуті щаблі, нарахування - це статус, а не дія, і саме тут він є темою сторінки. Стан замовлення говорить кольорами стану: доставлено - спокійний зелений, у дорозі - бурштин, обробляється - сірий; акцент до цього не залучається. Рух бонусів розрізняє списання і згоряння (згоряння - підсвічений рядок і бурштинова цифра): згоряння - це драйвер повернення, воно не має губитись серед звичайних витрат. Кожна цифра - грошi, баланс, телефон, номер замовлення - моноширинна."
