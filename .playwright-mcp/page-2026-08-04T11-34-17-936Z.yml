  - generic [ref=e46]:
    - generic [ref=e47]:
      - generic [ref=e48]: Дослідження продукту
      - 'heading "Stack: довіра та шлях від мети до продукту" [level=1] [ref=e49]'
      - paragraph [ref=e50]: Синтез конкурентного аналізу, бенчмарку та UX-патернів для мобільного магазину спортивного харчування в Україні, побудованого навколо тренерського каналу.
      - generic [ref=e51]:
        - generic [ref=e52]:
          - strong [ref=e53]: Ринок
          - text: Тільки Україна
        - generic [ref=e54]:
          - strong [ref=e55]: Платформа
          - text: Мобільний веб (mobile-first)
        - generic [ref=e56]:
          - strong [ref=e57]: Дата
          - text: Червень 2026
        - generic [ref=e58]:
          - strong [ref=e59]: Фаза
          - text: 1 з 6
    - generic [ref=e60]:
      - generic [ref=e61]: "01"
      - heading "Вступ" [level=2] [ref=e62]
      - paragraph [ref=e63]: Проблема, підхід та п'ять головних висновків дослідження.
      - heading "Проблема" [level=3] [ref=e64]
      - paragraph [ref=e65]: Українські магазини спортивного харчування побудовані для того, хто вже знає, що шукає. Каталог на 2500+ SKU без жодної інтерактивної навігації по цілях - це норма ринку. Початківець, який не знає різниці між ізолятом і комплексним протеїном, залишає сторінку. Тренер, який замовляє для 15 спортсменів одночасно, мусить відкрити 15 вкладок і вгадувати формат замовлення. Постійний покупець щоразу заново шукає той самий продукт.
      - paragraph [ref=e66]: Нікого це не влаштовує, але такий стан речей зберігається, бо жоден локальний гравець не вирішив задачу системно.
      - heading "Підхід до дослідження" [level=3] [ref=e67]
      - paragraph [ref=e68]: "П'ять послідовних фаз: гіпотези продуктової моделі, AARRR-воронка, конкурентний аналіз 15 компаній (HARD/SOFT/ASPIRATIONAL), бенчмарк 5 кращих продуктів за 8 критеріями, аналіз UX-патернів. Усі факти підкріплені прямим доступом до сайтів або посиланням на джерело. Нічого не вигадано."
      - heading "5 головних висновків" [level=3] [ref=e69]
      - generic [ref=e70]:
        - generic [ref=e71]:
          - generic [ref=e72]: "01"
          - generic [ref=e73]: Навігація по цілях - це продуктовий диференціатор. Жоден украйнський магазин спортпіту не має інтерактивного квізу або goal selector. Liki24 вже навчив українських користувачів шукати за симптомом, а не за категорією. Stack - перший у спортпіті.
        - generic [ref=e74]:
          - generic [ref=e75]: "02"
          - generic [ref=e76]: Тренерський канал - це відкрита ніша. Лише belok.ua має wholesale-форму (захована на /opt/). Всі інші конкуренти обслуговують тренерів як звичайних B2C-покупців. Самообслуговування для тренерів - це не функція, це категорійна позиція.
        - generic [ref=e77]:
          - generic [ref=e78]: "03"
          - generic [ref=e79]: "Довіра - основний бар'єр конверсії, не ціна. Порожня сторінка сертифікатів belok.ua і безліч \"100% оригінал\"-заявок без підтвердження показують: прозорість складу і походження - ще не норма на ринку. Всі топові міжнародні гравці ведуть з безпекою, а не з ціною."
        - generic [ref=e80]:
          - generic [ref=e81]: "04"
          - generic [ref=e82]: "Підписка - не правильне рішення для MVP в Україні. Проблема повторного замовлення реальна і підтверджена, але subscription-модель (Thorne, Bulk, AG1) вимагає рівня довіри до рекурентного списання, якого на українському ринку ще немає. MVP: email/SMS-нагадування + один дотик для повтору."
        - generic [ref=e83]:
          - generic [ref=e84]: "05"
          - generic [ref=e85]: "Мобільний досвід недорозвинений, але очікуваний. Лише belok.ua (Android) і Liki24 (iOS+Android) мають підтверджені застосунки в Україні. Кейс редизайну Liki24 підтверджує: українські покупці активно використовують мобільний. Mobile-first веб Stack повинен відчуватися як рідний, не стислий."
    - generic [ref=e86]:
      - generic [ref=e87]: "02"
      - heading "Lean UX Canvas" [level=2] [ref=e88]
      - paragraph [ref=e89]: Виконавче резюме дослідження на одному екрані. Lean UX Canvas v2 (Jeff Gothelf).
      - generic [ref=e90]:
        - generic [ref=e91]:
          - generic [ref=e92]: 01. Бізнес-проблема
          - paragraph [ref=e93]: Українські магазини спортивного харчування побудовані для покупця, який вже знає, що шукає. Немає інтерактивного goal-квізу, немає тренерських інструментів самообслуговування, немає прозорості складу на рівні картки продукту. Початківець залишає сторінку. Тренер замовляє вручну через форми або дзвінки. Постійний покупець щоразу заново шукає той самий продукт.
        - generic [ref=e94]:
          - generic [ref=e95]: 02. Бізнес-результати
          - list [ref=e96]:
            - listitem [ref=e97]: • Менше 5% повернень на сторінках продуктів
            - listitem [ref=e98]: • 40% GMV від тренерських акаунтів за 6 місяців [?]
            - listitem [ref=e99]: • 40% завершення goal-квізу [?]
            - listitem [ref=e100]: • 35% повторних покупок за 30 днів [?]
        - generic [ref=e101]:
          - generic [ref=e102]: 03. Користувачі
          - generic [ref=e103]: "Основний: тренери і зали (25-45) - замовляють для спортсменів"
          - generic [ref=e104]: "Вторинний: початківці (18-35) - розгублені в каталозі"
          - generic [ref=e105]: "Підтримувальний: постійні покупці (22-40) - поповнюють запас"
        - generic [ref=e106]:
          - generic [ref=e107]: 04. Результати і вигоди для користувача
          - list [ref=e108]:
            - listitem [ref=e109]: "• Тренер: замовив для всіх клієнтів за одну сесію, надійно і швидко"
            - listitem [ref=e110]: "• Початківець: знаю, що безпечно і підходить для моєї мети"
            - listitem [ref=e111]: "• Постійний: ніколи не закінчується, без зайвих кроків і рішень"
        - generic [ref=e112]:
          - generic [ref=e113]: 05. Рішення
          - list [ref=e114]:
            - listitem [ref=e115]: • Мультиклієнтський кошик зі збереженими профілями спортсменів
            - listitem [ref=e116]: "• Goal-квіз: 3-5 запитань, одразу перевірений набір продуктів"
            - listitem [ref=e117]: "• Картка продукту: склад, дозування, походження, сертифікація - до ціни"
            - listitem [ref=e118]: • Email/SMS-нагадування + повтор замовлення в один дотик
        - generic [ref=e119]:
          - generic [ref=e120]: 06. Гіпотези
          - list [ref=e121]:
            - listitem [ref=e122]: • Якщо goal-квіз - то вища конверсія початківців, бо проблема каталогу, а не ціна.
            - listitem [ref=e123]: • Якщо мультиклієнтський кошик - то повторні замовлення тренерів понад 80% за 90 днів, бо надійний постачальник - це висока вартість переключення.
            - listitem [ref=e124]: • Якщо довіра до ціни - то менший bounce, бо головний бар'єр - страх безпеки, а не ціна.
        - generic [ref=e125]:
          - generic [ref=e126]: 07. Що найважливіше дізнатися першим
          - paragraph [ref=e127]: "Чи переключаться тренери на Stack заради кращого досвіду для себе і своїх спортсменів - коли ціна залишається в ринковому діапазоні? belok.ua, GymBeam UA, mega-mass.ua і vansiton.ua вже мають якусь B2B/wholesale-інфраструктуру. Питання вже не \"чи замовлятимуть тренери онлайн\" - деякі вже замовляють. Питання: чи достатньо кращий досвід Stack, щоб виправдати перехід. Якщо єдина причина переходу - ціна, ставка програє: обсяги та собівартість у конкурентів більші."
        - generic [ref=e128]:
          - generic [ref=e129]: 08. Мінімальний тест
          - paragraph [ref=e130]: "Інтерв'ю з тренерами двох груп до написання коду. Група 1: ті, хто вже купує через wholesale або B2B-програму (belok.ua /opt/, GymBeam B2B, mega-mass.ua, vansiton.ua). Група 2: тренери без постійного постачальника, замовляють хаотично. Для обох груп: що реально змусило б вас перейти до нового постачальника? Це досвід замовлення і те, що він дає вашим спортсменам, - чи виключно ціна за одиницю? Що \"краще для спортсменів\" означає для вас на практиці?"
      - paragraph [ref=e131]: Lean UX Canvas v2, Jeff Gothelf. Заповнено з матеріалів дослідження (strategy.md, aarrr.md, competitive-analysis.md).
    - generic [ref=e132]:
