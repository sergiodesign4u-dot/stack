      - heading "Стратегія" [level=2] [ref=e134]
      - paragraph [ref=e135]: Версія refresh, валідована після конкурентного аналізу. Цілі, сегменти, бізнес-модель та найризикованіша гіпотеза.
      - heading "Stack в одному реченні" [level=3] [ref=e136]
      - paragraph [ref=e138]: Stack - мобільний магазин спортивного харчування для українського ринку, побудований навколо тренерів і залів, що замовляють для своїх спортсменів. Перетворює незрозумілий каталог на зрозумілий шлях від мети до правильного продукту - і підтримує постійних покупців простими повторними замовленнями.
