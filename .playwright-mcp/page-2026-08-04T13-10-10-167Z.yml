              - generic [ref=f19e221]:
                - paragraph [ref=f19e222]: OPTIMUM NUTRITION 100% WHEY GOLD STANDARD У МАГАЗИНІ БІЛОК
                - paragraph [ref=f19e223]:
                  - link "Протеїн" [ref=f19e224] [cursor=pointer]:
                    - /url: https://belok.ua/ua/protein/
                  - text: популярний серед активних людей, оскільки легко засвоюється і є багатим джерелом амінокислот для відновлення м'язів.
                - paragraph [ref=f19e225]: Ізолят сироваткового протеїну це одна з найчистіших форм сироватки і основний компонент в Gold Standard 100% Whey від Optimum Nutrition - сироватковому протеїні, що найбільше продається в світі. Кожна порція Gold Standard 100% Whey містить 24 грами сироваткового протеїну, що швидко засвоюється, з мінімальним вмістом жиру, лактози та інших непотрібних речовин. Не викликає сумніву, що Gold Standard 100% Whey - це стандарт, на який дорівнюють всі інші виробники сироваткових білків.
                - paragraph [ref=f19e226]: "Основні особливості Optimum nutrition gold standard 100 whey:"
                - paragraph
                - list [ref=f19e227]:
                  - listitem [ref=f19e228]: Gold Standard 100% Whey виготовлений з ізоляту сироваткового протеїну
                  - listitem [ref=f19e229]: містить ізолят сироваткового, ультрафільтрований концентрат мікрофракції сироваткового протеїну
                  - listitem [ref=f19e230]: у кожній порції понад 4 г глютаміну
                  - listitem [ref=f19e231]: більше, ніж 5 грам BCAA (амінокислот з розгалуженим ланцюгом - лейцин, ізолейцин та валін) у кожній порції
                  - listitem [ref=f19e232]: Gold Standard 100% Whey від Optimum Nutrition є "Золотим стандартом" серед протеїнів
                - paragraph
                - paragraph [ref=f19e233]: "Інгредієнти: протеїнова суміш (ізолят сироваткового протеїну, концентрат сироваткового протеїну, сироваткові пептиди), натуральні та штучні ароматизатори, соняшниковий або соєвий лецитин, ацесульфам калію, Aminogen (Аміноген)."
                - paragraph [ref=f19e234]: "Рекомендації щодо застосування Optimum nutrition whey gold standard: Змішайте одну мірну ложку Gold Standard 100% Whey із 180-240 мл. холодної води або ваш улюблений напій. Приймайте протягом дня, щоб задовольнити ваші потреби в білку. Також ви можете використовувати Gold Standard 100% Whey для приготування різноманітних страв."
                - paragraph [ref=f19e235]
                - paragraph [ref=f19e237]
