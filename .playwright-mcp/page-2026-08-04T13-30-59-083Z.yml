      - heading "Фокус і правило" [level=2] [ref=f41e71]
      - paragraph [ref=f41e72]: "Одна персона, одна робота. Олена - тренерка, яка вже має постачальника (Персона 1, первинна), × продуктова main job: зібрати повне замовлення на кожного клієнта за одну сесію і надійно отримати товар, не втративши професійної репутації."
      - generic [ref=f41e73]:
        - paragraph [ref=f41e74]: "As-Is живе за правилом ресерчу, не дизайну. Кожна емоція - з джерела. Немає джерела - стоїть [?], і на кривій розрив. Асиметрія свідома: As-Is не має права вигадати емоцію, To-Be не має права вигадати причину."
        - paragraph [ref=f41e75]: "Обрана вона тому, що вирішує primary: якщо Stack не переконає Олену, бізнес-модель не працює. Її ймовірність переходу - низька: у неї є робоча система, хай і незручна. Саме це карта й пояснює - не що зламано, а що вона терпить і чому досі лишається."
