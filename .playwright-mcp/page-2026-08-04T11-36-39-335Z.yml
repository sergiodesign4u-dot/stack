        - generic [ref=f1e52]:
          - strong [ref=f1e53]: Ринок
          - text: Тільки Україна
        - generic [ref=f1e54]:
          - strong [ref=f1e55]: Платформа
          - text: Мобільний веб (mobile-first)
        - generic [ref=f1e56]:
          - strong [ref=f1e57]: Дата
          - text: Червень 2026
        - generic [ref=f1e58]:
          - strong [ref=f1e59]: Фаза
          - text: 1 з 6
    - generic [ref=f1e60]:
      - generic [ref=f1e61]: "01"
      - heading "Вступ" [level=2] [ref=f1e62]
      - paragraph [ref=f1e63]: Проблема, підхід та п'ять головних висновків дослідження.
      - heading "Проблема" [level=3] [ref=f1e64]
      - paragraph [ref=f1e65]: Українські магазини спортивного харчування побудовані для того, хто вже знає, що шукає. Каталог на 2500+ SKU без жодної інтерактивної навігації по цілях - це норма ринку. Початківець, який не знає різниці між ізолятом і комплексним протеїном, залишає сторінку. Тренер, який замовляє для 15 спортсменів одночасно, мусить відкрити 15 вкладок і вгадувати формат замовлення. Постійний покупець щоразу заново шукає той самий продукт.
      - paragraph [ref=f1e66]: Нікого це не влаштовує, але такий стан речей зберігається, бо жоден локальний гравець не вирішив задачу системно.
      - heading "Підхід до дослідження" [level=3] [ref=f1e67]
      - paragraph [ref=f1e68]: "П'ять послідовних фаз: гіпотези продуктової моделі, AARRR-воронка, конкурентний аналіз 15 компаній (HARD/SOFT/ASPIRATIONAL), бенчмарк 5 кращих продуктів за 8 критеріями, аналіз UX-патернів. Усі факти підкріплені прямим доступом до сайтів або посиланням на джерело. Нічого не вигадано."
      - heading "5 головних висновків" [level=3] [ref=f1e69]
      - generic [ref=f1e70]:
        - generic [ref=f1e71]:
          - generic [ref=f1e72]: "01"
          - generic [ref=f1e73]: Навігація по цілях - це продуктовий диференціатор. Жоден украйнський магазин спортпіту не має інтерактивного квізу або goal selector. Liki24 вже навчив українських користувачів шукати за симптомом, а не за категорією. Stack - перший у спортпіті.
        - generic [ref=f1e74]:
          - generic [ref=f1e75]: "02"
          - generic [ref=f1e76]: Тренерський канал - це відкрита ніша. Лише belok.ua має wholesale-форму (захована на /opt/). Всі інші конкуренти обслуговують тренерів як звичайних B2C-покупців. Самообслуговування для тренерів - це не функція, це категорійна позиція.
        - generic [ref=f1e77]:
          - generic [ref=f1e78]: "03"
          - generic [ref=f1e79]: "Довіра - основний бар'єр конверсії, не ціна. Порожня сторінка сертифікатів belok.ua і безліч \"100% оригінал\"-заявок без підтвердження показують: прозорість складу і походження - ще не норма на ринку. Всі топові міжнародні гравці ведуть з безпекою, а не з ціною."
        - generic [ref=f1e80]:
          - generic [ref=f1e81]: "04"
          - generic [ref=f1e82]: "Підписка - не правильне рішення для MVP в Україні. Проблема повторного замовлення реальна і підтверджена, але subscription-модель (Thorne, Bulk, AG1) вимагає рівня довіри до рекурентного списання, якого на українському ринку ще немає. MVP: email/SMS-нагадування + один дотик для повтору."
        - generic [ref=f1e83]:
          - generic [ref=f1e84]: "05"
          - generic [ref=f1e85]: "Мобільний досвід недорозвинений, але очікуваний. Лише belok.ua (Android) і Liki24 (iOS+Android) мають підтверджені застосунки в Україні. Кейс редизайну Liki24 підтверджує: українські покупці активно використовують мобільний. Mobile-first веб Stack повинен відчуватися як рідний, не стислий."
    - generic [ref=f1e86]:
      - generic [ref=f1e87]: "02"
      - heading "Lean UX Canvas" [level=2] [ref=f1e88]
      - paragraph [ref=f1e89]: Виконавче резюме дослідження на одному екрані. Lean UX Canvas v2 (Jeff Gothelf).
      - generic [ref=f1e90]:
        - generic [ref=f1e91]:
          - generic [ref=f1e92]: 01. Бізнес-проблема
          - paragraph [ref=f1e93]: Українські магазини спортивного харчування побудовані для покупця, який вже знає, що шукає. Немає інтерактивного goal-квізу, немає тренерських інструментів самообслуговування, немає прозорості складу на рівні картки продукту. Початківець залишає сторінку. Тренер замовляє вручну через форми або дзвінки. Постійний покупець щоразу заново шукає той самий продукт.
        - generic [ref=f1e94]:
          - generic [ref=f1e95]: 02. Бізнес-результати
          - list [ref=f1e96]:
            - listitem [ref=f1e97]: • Менше 5% повернень на сторінках продуктів
            - listitem [ref=f1e98]: • 40% GMV від тренерських акаунтів за 6 місяців [?]
            - listitem [ref=f1e99]: • 40% завершення goal-квізу [?]
            - listitem [ref=f1e100]: • 35% повторних покупок за 30 днів [?]
        - generic [ref=f1e101]:
          - generic [ref=f1e102]: 03. Користувачі
          - generic [ref=f1e103]: "Основний: тренери і зали (25-45) - замовляють для спортсменів"
          - generic [ref=f1e104]: "Вторинний: початківці (18-35) - розгублені в каталозі"
          - generic [ref=f1e105]: "Підтримувальний: постійні покупці (22-40) - поповнюють запас"
        - generic [ref=f1e106]:
          - generic [ref=f1e107]: 04. Результати і вигоди для користувача
          - list [ref=f1e108]:
            - listitem [ref=f1e109]: "• Тренер: замовив для всіх клієнтів за одну сесію, надійно і швидко"
            - listitem [ref=f1e110]: "• Початківець: знаю, що безпечно і підходить для моєї мети"
            - listitem [ref=f1e111]: "• Постійний: ніколи не закінчується, без зайвих кроків і рішень"
        - generic [ref=f1e112]:
          - generic [ref=f1e113]: 05. Рішення
          - list [ref=f1e114]:
            - listitem [ref=f1e115]: • Мультиклієнтський кошик зі збереженими профілями спортсменів
            - listitem [ref=f1e116]: "• Goal-квіз: 3-5 запитань, одразу перевірений набір продуктів"
            - listitem [ref=f1e117]: "• Картка продукту: склад, дозування, походження, сертифікація - до ціни"
            - listitem [ref=f1e118]: • Email/SMS-нагадування + повтор замовлення в один дотик
        - generic [ref=f1e119]:
          - generic [ref=f1e120]: 06. Гіпотези
          - list [ref=f1e121]:
            - listitem [ref=f1e122]: • Якщо goal-квіз - то вища конверсія початківців, бо проблема каталогу, а не ціна.
            - listitem [ref=f1e123]: • Якщо мультиклієнтський кошик - то повторні замовлення тренерів понад 80% за 90 днів, бо надійний постачальник - це висока вартість переключення.
            - listitem [ref=f1e124]: • Якщо довіра до ціни - то менший bounce, бо головний бар'єр - страх безпеки, а не ціна.
        - generic [ref=f1e125]:
          - generic [ref=f1e126]: 07. Що найважливіше дізнатися першим
          - paragraph [ref=f1e127]: "Чи переключаться тренери на Stack заради кращого досвіду для себе і своїх спортсменів - коли ціна залишається в ринковому діапазоні? belok.ua, GymBeam UA, mega-mass.ua і vansiton.ua вже мають якусь B2B/wholesale-інфраструктуру. Питання вже не \"чи замовлятимуть тренери онлайн\" - деякі вже замовляють. Питання: чи достатньо кращий досвід Stack, щоб виправдати перехід. Якщо єдина причина переходу - ціна, ставка програє: обсяги та собівартість у конкурентів більші."
        - generic [ref=f1e128]:
          - generic [ref=f1e129]: 08. Мінімальний тест
          - paragraph [ref=f1e130]: "Інтерв'ю з тренерами двох груп до написання коду. Група 1: ті, хто вже купує через wholesale або B2B-програму (belok.ua /opt/, GymBeam B2B, mega-mass.ua, vansiton.ua). Група 2: тренери без постійного постачальника, замовляють хаотично. Для обох груп: що реально змусило б вас перейти до нового постачальника? Це досвід замовлення і те, що він дає вашим спортсменам, - чи виключно ціна за одиницю? Що \"краще для спортсменів\" означає для вас на практиці?"
      - paragraph [ref=f1e131]: Lean UX Canvas v2, Jeff Gothelf. Заповнено з матеріалів дослідження (strategy.md, aarrr.md, competitive-analysis.md).
    - generic [ref=f1e132]:
      - generic [ref=f1e133]: "03"
      - heading "Стратегія" [level=2] [ref=f1e134]
      - paragraph [ref=f1e135]: Версія refresh, валідована після конкурентного аналізу. Цілі, сегменти, бізнес-модель та найризикованіша гіпотеза.
      - heading "Stack в одному реченні" [level=3] [ref=f1e136]
      - paragraph [ref=f1e138]: Stack - мобільний магазин спортивного харчування для українського ринку, побудований навколо тренерів і залів, що замовляють для своїх спортсменів. Перетворює незрозумілий каталог на зрозумілий шлях від мети до правильного продукту - і підтримує постійних покупців простими повторними замовленнями.
      - heading "Jobs to Be Done" [level=3] [ref=f1e139]
