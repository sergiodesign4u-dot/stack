      - generic [ref=f2e52]: Посторінкова IA · картка товару (PDP) · вузол 3.0
      - heading "Картка товару" [level=1] [ref=f2e53]
      - paragraph [ref=f2e54]: "Сторінка, заради якої існує довіра в магазині, і ціль конверсії кожної картки товару. Тут користувач перевіряє, що продукт безпечний, сертифікований і правильно дозований (Job 4: склад · дозування · походження · сертифікація), і робить крок «У кошик» (конверсія Job 2 і Job 3). На цій же сторінці живуть 3.1 Відгуки, 3.2 Питання, 3.3 Схожі. Принцип №1 — спершу прибрати сумнів, потім продавати."
      - generic [ref=f2e55]:
        - generic [ref=f2e56]:
          - strong [ref=f2e57]: Вузол
          - text: 3.0 (+ 3.1 / 3.2 / 3.3 на сторінці)
        - generic [ref=f2e58]:
