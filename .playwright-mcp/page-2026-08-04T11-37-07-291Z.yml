        - generic [ref=f2e62]:
          - strong [ref=f2e63]: Джерело істини
          - text: ia/docs/pages/product.md
    - generic [ref=f2e64]: "Ключове рішення: блок довіри (Склад · Дозування · Походження · Сертифікація) — ведучий, одразу під buy-box, а не схований у «Опис» під згином. Один головний CTA «У кошик» (на мобілці — липка нижня смуга). Сертифікат — реальний переглядний контент, а відгуки + сертифікат — це recovery для непереконаного покупця (за потоком Job 3), щоб він не пішов із сумнівом."
    - generic [ref=f2e65]:
      - generic [ref=f2e66]: 01 · Десктоп і мобілка
      - heading "Анатомія сторінки товару" [level=2] [ref=f2e67]
      - paragraph [ref=f2e68]: "Приклад: Gold Standard 100% Whey 2270 г. Хедер → крихти → таб-навігація по товару (Про товар · Склад · … — прилипає до хедера при скролі й несе увесь ціновий факт: стара ціна + бейдж −% над живою цифрою, поруч «Купити») → дві колонки: галерея + buy-box (H1 · бренд · статус-рядок одним рядком: наявність + артикул ліворуч, рейтинг праворуч · «проста відповідь» · варіанти смак/вага · ціна й дія в один ряд — стара ціна + бейдж −% поруч, під ними нова крупно, праворуч «У кошик» + ♡, без лічильника кількості · ціна за порцію · ціна тренера · блоки Доставка + Оплата з чипом міста) → єдина смуга довіри (оригінал · сертифікат · доставка · повернення) перед складом → блок довіри (склад + етикетка з упаковки · дозування · походження · сертифікація — ведучий, секції відкриті) → опис (повний) + фото → характеристики → відгуки (3.1) → питання (3.2) → схожі (3.3) → статті по темі → футер."
      - paragraph [ref=f2e69]: Мокап навмисно чорно-білий (вайрфрейм-рівень) — колір додамо на етапі концепту.
